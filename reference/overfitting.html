<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>速查 · 过拟合与早停</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><nav><a href="../lessons/0006-overfitting.html">返回 Demo 3</a></nav><h1>过拟合与早停</h1><dl><dt>过拟合</dt><dd>模型过度适应训练数据的偶然细节，未能相应改善新数据表现。</dd><dt>训练集</dt><dd>用于计算梯度、更新参数。</dd><dt>验证集</dt><dd>用于选择设置与训练检查点，间接影响最终模型。</dd><dt>测试集</dt><dd>设置确定后评估保留数据上的表现，不用于反复调参。</dd><dt>早停与 patience</dt><dd>验证表现连续一定次数未改善就停止，并恢复此前最好的检查点。等待次数称为 patience。</dd><dt>参数快照</dt><dd>独立保存的参数值，避免继续训练覆盖旧结果。</dd></dl><p>大模型并非必然过拟合；需结合数据量、噪声和训练过程观察。来源：<a href="https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html">D2L 泛化与过拟合</a>。</p></main></body></html>
