<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>速查 · 注意力</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><a href="../lessons/0007-attention.html">返回 Demo 4</a><h1>注意力速查</h1><dl><dt>Q / K / V</dt><dd>查询、键、值。Q/K 计算匹配分数，V 提供按权重混合的内容。</dd><dt>点积</dt><dd>对应元素相乘后求和；用于这里的向量匹配分数。</dd><dt>Softmax</dt><dd>每个分数取指数，再除以同一行所有指数的和，得到总和为 1 的权重。</dd><dt>自注意力</dt><dd>Q/K/V 来自同一个输入序列的表示。</dd><dt>因果遮罩</dt><dd>禁止当前位置读取未来位置，通常允许读取自己。</dd></dl><p>输出 = softmax(QKᵀ / sqrt(d)) V。注意力权重不是语义理解或因果解释的保证。</p><p>来源：<a href="https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html">PyTorch 注意力算子</a>。</p></main></body></html>
