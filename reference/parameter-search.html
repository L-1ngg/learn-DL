<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>速查 · 尝试参数</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><nav><a href="../lessons/0003-try-parameters.html">返回第三课</a></nav><h1>尝试参数</h1><p>本例：预测 = 输入 × w；绝对误差 = abs(预测 − 目标)。</p><dl><dt>候选参数 w</dt><dd>当前正在尝试的数。</dd><dt>最佳参数 best_w</dt><dd>截至目前尝试过的值中，损失最小的参数。相同损失时本例保留先找到的值。</dd><dt>循环 for</dt><dd>按顺序取候选值，重复执行缩进的计算。</dd><dt>条件 if</dt><dd>本例仅当新损失更小时更新最佳记录。</dd></dl><p>有限枚举只能比较尝试过的值，不保证找到所有可能参数中的最佳值。本例不是梯度下降。</p><p>来源：<a href="https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function">《动手学深度学习》参数与损失</a>。绝对误差枚举为本课自拟简化实验，区别于教材平方损失。</p></main></body></html>
